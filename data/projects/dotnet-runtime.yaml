name: .NET runtime
repo: dotnet/runtime
license: MIT
status: production
summary: >-
  Team members assign scoped issues to GitHub Copilot Coding Agent, which opens
  PRs; every PR (human, agent or external) gets automated AI review. The best
  public data set on agent PRs in a critical codebase.
factory:
  name: Copilot Coding Agent (CCA)
  since: 2025-05
  level: 2
  stages: [implement, review, test]
  human_gates: [trigger, merge]
  factory_code: closed
  stack:
    agents: GitHub Copilot Coding Agent
  bots: [Copilot]
  evidence_query: "is:pr head:copilot/"
metrics:
  - label: CCA PRs over ten months
    value: "878 opened, 535 merged (67.9% success)"
    as_of: 2026-03
    source: https://devblogs.microsoft.com/dotnet/ten-months-with-cca-in-dotnet-runtime/
  - label: Revert rate of merged CCA PRs
    value: "0.6%"
    as_of: 2026-03
    source: https://startdebugging.net/2026/03/copilot-coding-agent-dotnet-runtime-ten-months-data/
sources:
  - title: Ten Months with Copilot Coding Agent in dotnet/runtime (Stephen Toub)
    url: https://devblogs.microsoft.com/dotnet/ten-months-with-cca-in-dotnet-runtime/
    date: 2026-03-23
