summary: >-
  Repro-Bot is an issue triage agent that attempts to reproduce public GitHub
  issues. It is run by a human on purpose, to keep poisoned issue content from
  driving the agent.
factory:
  name: Repro-Bot
  since: 2026-04
  level: 1
  stages: [triage, reproduce]
  human_gates: [trigger, decision]
  factory_code: closed
  evidence_query: ""
sources:
