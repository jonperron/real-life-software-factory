name: refresh-stats

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - name: Fetch GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_stats.py
      - name: Regenerate README
        run: python scripts/build.py
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/refresh-stats
          commit-message: "chore: refresh GitHub stats"
          title: "chore: weekly stats refresh"
          body: "Automated refresh of stars, licenses and evidence counts. Check the workflow log for archived/stale/redirected repos."
          delete-branch: true
